name: activescaffold/active_scaffold
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: "${{ github.ref }}"
  cancel-in-progress: true
jobs:
  lint-brakeman:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BUNDLE_CLEAN: true
      BUNDLE_DEPLOYMENT: true
      BUNDLE_WITHOUT: 'default deployment development production test performance'
    steps:
      - uses: actions/checkout@v4.1.0
        with:
          lfs: true
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - run: bundle exec brakeman --exit-on-warn --output brakeman/index.html
      - uses: actions/upload-artifact@v4.1.0
        if: always()
        with:
          name: "${{ github.job }}"
          retention-days: 1
          path: brakeman
  lint-i18n:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BUNDLE_CLEAN: true
      BUNDLE_DEPLOYMENT: true
      BUNDLE_WITHOUT: 'default deployment development production test performance'
    steps:
      - uses: actions/checkout@v4.1.0
        with:
          lfs: true
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Check required translations
        run: |
          bundle exec i18n-tasks missing --locales base --types used
          bundle exec i18n-tasks check-reserved-interpolations
  lint-rubocop:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BUNDLE_CLEAN: true
      BUNDLE_DEPLOYMENT: true
      BUNDLE_WITHOUT: 'default deployment development production test performance'
    steps:
      - uses: actions/checkout@v4.1.0
        with:
          lfs: true
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - run: bundle exec rubocop
  test:
    name: Ruby ${{ matrix.ruby }} / Rails ${{ matrix.rails }}
    needs:
      - test-bridges
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.allow_failure || false }}
    strategy:
      fail-fast: false
      matrix:
        ruby: [ "4.0", "3.4", "3.3" ]
        rails: [ "8.1" ]
        include:
          - ruby: '4.0'
            rails: '8.1'
            coverage: true
            allow_failure: false
    timeout-minutes: 60
    env:
      JRUBY_OPTS: "--debug"
      LC_ALL: C.UTF-8
      RAILS_ENV: test
      BUNDLE_GEMFILE: gemfiles/Gemfile.rails-${{ matrix.rails }}.x
      BUNDLE_CLEAN: true
      BUNDLE_DEPLOYMENT: true
      BUNDLE_WITHOUT: 'deployment development lint production performance'
    steps:
      - uses: actions/checkout@v4.1.0
        with:
          lfs: true
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - uses: actions/download-artifact@v4.1.0
        if: matrix.coverage && needs.test-bridges.result == 'success'
        with:
          name: installed-bridges-coverage
          path: coverage
      - name: Test
        env:
          COVERAGE: ${{ matrix.coverage }}
          COVERAGE_COMMAND_NAME: ruby-${{ matrix.ruby }}-rails-${{ matrix.rails }}
        run: bundle exec rake
      - uses: qltysh/qlty-action/coverage@v1
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: coverage/coverage.json
        if: matrix.coverage && needs.test-bridges.result == 'success'
      - uses: actions/upload-artifact@v4.1.0
        if: success() && matrix.coverage && needs.test-bridges.result == 'success'
        with:
          name: "${{ github.job }}-coverage"
          retention-days: 1
          path: coverage
  test-bridges:
    name: Installed bridge gems
    needs:
      - lint-brakeman
      - lint-i18n
      - lint-rubocop
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LC_ALL: C.UTF-8
      RAILS_ENV: test
      BUNDLE_GEMFILE: gemfiles/Gemfile.bridges
      BUNDLE_CLEAN: true
      BUNDLE_DEPLOYMENT: true
      BUNDLE_WITHOUT: 'deployment development lint production performance'
    steps:
      - uses: actions/checkout@v4.1.0
        with:
          lfs: true
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Test installed bridges with coverage
        env:
          COVERAGE: true
          COVERAGE_COMMAND_NAME: ruby-3.3-rails-8.1-bridges
        run: bundle exec rake test:installed_bridges
      - uses: actions/upload-artifact@v4.1.0
        with:
          name: installed-bridges-coverage
          retention-days: 1
          path: coverage/.resultset.json
          include-hidden-files: true
  ci-success:
    name: "CI Success"
    needs: [test, test-bridges]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All mandatory tests passed successfully."
